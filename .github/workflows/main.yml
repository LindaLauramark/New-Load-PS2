
name: New Load PS2 - Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar ferramentas PS2
        shell: sh
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"
          echo "PATH=$PATH"

          echo "Procurando compiladores:"
          command -v ee-gcc || true
          command -v mips64r5900el-ps2-elf-gcc || true

          echo "Procurando make:"
          command -v make || true

          echo "Verificando diretorios:"
          ls -la "$PS2DEV/bin" || true
          ls -la "$PS2DEV/ee/bin" || true

          echo "Diagnostico finalizado."

      - name: Instalar ferramentas de compilacao
        shell: sh
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache make git python3 py3-yaml bash
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y make git python3 python3-yaml bash
          else
            echo "Gerenciador de pacotes nao encontrado."
            exit 1
          fi

          make --version
          git --version
          python3 --version

      - name: Verificar arquivos de idioma
        shell: sh
        run: |
          echo "Arquivos relacionados aos idiomas:"
          find . -iname '*lang*' -o -iname '*lng*'

          echo "Scripts disponiveis:"
          ls -la lng_pack.sh lng lng_tmpl 2>/dev/null || true

          echo "Referencias no Makefile:"
          grep -nE 'lang_autogen|lng_pack|lng|python' Makefile || true

      - name: Preparar idiomas
        shell: sh
        run: |
          python3 generate_internal_language.py

      - name: Configurar Git
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compilar New Load PS2
        shell: sh
        run: |
          make NOT_PACKED=1 LOCALVERSION=newload

      - name: Preparar executavel
        if: success()
        shell: sh
        run: |
          mkdir -p dist

          if [ ! -s "opl.elf" ]; then
            echo "ERRO: opl.elf nao foi encontrado na pasta principal."
            echo "Arquivos ELF encontrados:"
            find . -type f -iname '*.elf'
            exit 1
          fi

          echo "Executavel principal encontrado:"
          ls -lh opl.elf

          cp opl.elf dist/NEWLOAD.ELF

      - name: Disponibilizar ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: New-Load-PS2-Teste
          path: dist/NEWLOAD.ELF
          if-no-files-found: error
