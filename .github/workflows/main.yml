
name: New Load PS2 - Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar ferramentas PS2
        shell: sh
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"
          command -v ee-gcc
          command -v make
          test -f Makefile

      - name: Compilar New Load PS2
        shell: sh
        run: |
          make NOT_PACKED=1 LOCALVERSION=newload

      - name: Preparar executavel
        if: success()
        shell: sh
        run: |
          test -s opl.elf
          mkdir -p dist
          cp opl.elf dist/NEWLOAD.ELF

      - name: Disponibilizar ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: New-Load-PS2-Teste
          path: dist/NEWLOAD.ELF
          if-no-files-found: error
